<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WireDistrict RP - Feed</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

h1{
    text-align:center;
}

#feed{
    max-width:800px;
    margin:0 auto;
}

.post{
    background:#1e1e1e;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
}

.post img{
    max-width:100%;
    border-radius:10px;
    margin-top:10px;
}

.loading{
    text-align:center;
    opacity:0.7;
}

</style>

</head>

<body>

<h1>🔥 WireDistrict Feed</h1>

<div id="feed" class="loading">Chargement...</div>

<script>

async function loadFeed(){

    const feed = document.getElementById("feed");

    try {

        // 🔥 RSS stable (ne casse pas comme l'API Mastodon)
        const response = await fetch(
            "https://rssproxy.deno.dev/?url=https://mastodon.social/@WireDistrict.rss"
        );

        const text = await response.text();

        const parser = new DOMParser();
        const xml = parser.parseFromString(text, "text/xml");

        const items = xml.querySelectorAll("item");

        feed.innerHTML = "";

        items.forEach((item, index) => {

            if(index >= 10) return;

            const title = item.querySelector("title")?.textContent || "";
            const content = item.querySelector("description")?.textContent || "";

            const div = document.createElement("div");
            div.className = "post";

            div.innerHTML = `
                <div>${content}</div>
            `;

            feed.appendChild(div);

        });

    } catch (err) {

        console.log(err);
        feed.innerHTML = "Erreur chargement feed ❌";

    }

}

loadFeed();

</script>

</body>

</html>
