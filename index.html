<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WireDistrict RP</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

#feed{
    max-width:800px;
    margin:0 auto;
}

.post{
    background:#1e1e1e;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
}

.post img{
    max-width:100%;
    border-radius:10px;
    margin-top:10px;
}

.loading{
    text-align:center;
    opacity:0.7;
}

</style>

</head>

<body>

<h1>🔥 WireDistrict RP</h1>

<div id="feed" class="loading">Chargement des posts...</div>

<script>

async function loadFeed(){

    const feed = document.getElementById("feed");

    try {

        // 🔥 récupérer compte Mastodon
        const userRes = await fetch(
            "https://mastodon.social/api/v1/accounts/lookup?acct=WireDistrict"
        );

        const user = await userRes.json();

        if(!user || !user.id){
            feed.innerHTML = "Compte introuvable ❌";
            return;
        }

        // 🔥 récupérer posts
        const postsRes = await fetch(
            `https://mastodon.social/api/v1/accounts/${user.id}/statuses?limit=10`
        );

        const posts = await postsRes.json();

        feed.innerHTML = "";

        posts.forEach(post => {

            const div = document.createElement("div");
            div.className = "post";

            let html = "";

            html += `<div>${post.content}</div>`;

            if(post.media_attachments && post.media_attachments.length > 0){
                post.media_attachments.forEach(media => {
                    if(media.type === "image"){
                        html += `<img src="${media.preview_url || media.url}">`;
                    }
                });
            }

            div.innerHTML = html;
            feed.appendChild(div);

        });

    } catch (err) {

        console.log(err);
        feed.innerHTML = "Erreur chargement Mastodon ❌";

    }

}

loadFeed();

</script>

</body>

</html>
