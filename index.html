<!DOCTYPE html>
<html>
<head>
  <title>WireDistrict Social</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 20px;
    }
    .post {
      background: #222;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>WireDistrict Social Feed</h1>

<div id="feed"></div>

<script>
const ID = "116511006505909205"; // <-- remplace ici

fetch(`https://mastodon.social/api/v1/accounts/${ID}/statuses`)
  .then(res => res.json())
  .then(data => {
    const feed = document.getElementById("feed");

    data.slice(0, 10).forEach(post => {
      const div = document.createElement("div");
      div.className = "post";
      div.innerHTML = post.content;
      feed.appendChild(div);
    });
  });
</script>

</body>
</html>
