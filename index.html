<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mastodon Feed</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    margin:0;
    padding:20px;
}

.post{
    background:#1e1e1e;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
}

.post img{
    max-width:100%;
    border-radius:10px;
    margin-top:10px;
}

.loading{
    text-align:center;
    opacity:0.7;
}
</style>
</head>

<body>

<div id="feed" class="loading">
Chargement Mastodon...
</div>

<script>

const ID = "116511006505909205";

async function loadFeed(){

    try{

        const response = await fetch(
            `https://mastodon.social/api/v1/accounts/${ID}/statuses`
        );

        const posts = await response.json();

        const feed = document.getElementById("feed");

        feed.innerHTML = "";

        posts.slice(0,10).forEach(post => {

            const div = document.createElement("div");
            div.className = "post";

            let html = "";

            // Contenu texte
            html += `
                <div>
                    ${post.content}
                </div>
            `;

            // Images
            if(post.media_attachments){

                post.media_attachments.forEach(media => {

                    if(media.type === "image"){

                        const img =
                            media.preview_url || media.url;

                        html += `
                            <img src="${img}">
                        `;
                    }

                });

            }

            div.innerHTML = html;

            feed.appendChild(div);

        });

    }
    catch(error){

        console.log(error);

        document.getElementById("feed").innerHTML =
            "Erreur chargement Mastodon ❌";

    }

}

loadFeed();

</script>

</body>
</html>
