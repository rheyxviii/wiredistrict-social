<div id="feed">Chargement...</div>

<script>
const ID = "116511006505909205";

fetch(`https://mastodon.social/api/v1/accounts/${ID}/statuses`)
  .then(res => res.json())
  .then(posts => {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    posts.slice(0, 10).forEach(post => {
      const div = document.createElement("div");
      div.style.background = "#222";
      div.style.padding = "10px";
      div.style.margin = "10px 0";
      div.style.borderRadius = "10px";

      // texte du post
      let content = post.content;

      // images du post
      let media = "";

      if (post.media_attachments && post.media_attachments.length > 0) {
        post.media_attachments.forEach(img => {
          if (img.type === "image") {
            media += `<img src="${img.url}" style="max-width:100%; border-radius:10px; margin-top:10px;">`;
          }
        });
      }

      div.innerHTML = content + media;

      feed.appendChild(div);
    });
  })
  .catch(err => {
    document.getElementById("feed").innerHTML =
      "Erreur chargement Mastodon ❌";
    console.error(err);
  });
</script>
